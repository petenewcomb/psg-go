name: CI

permissions:
  contents: write # to update coverage report on the wiki

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 13 * * 6' # run each Saturday at 1pm UTC
  workflow_dispatch:

jobs:
  ci:
    uses: petenewcomb/ci-go/.github/workflows/ci.yml@v0.0.9
    with:
      # PSG has very heavy benchmarks - give full tests 2 hours
      fullTestTimeoutMinutes: 120
      full1CpuTestTimeoutMinutes: 120
      fullRaceTestTimeoutMinutes: 120
